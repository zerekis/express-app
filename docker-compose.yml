services:
  express-app:
    image: zerekis/express-app:latest
    container_name: express-app
    ports:
      - "8080:8080"

  watchtower:
    image: nickfedor/watchtower:latest
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: express-app
    container_name: watchtower
    network_mode: host
